<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mise</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: #f2f2f7; color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased; text-align: center; padding: 24px;
    }
    .logo { width: 72px; height: 72px; }
    .title { font-size: 1.4rem; font-weight: 800; letter-spacing: -.04em; }
    .sub { font-size: .9rem; color: #6d6d72; max-width: 280px; line-height: 1.5; }
    button {
      margin-top: 8px; padding: 14px 28px; border: none; border-radius: 14px;
      background: #007aff; color: #fff; font-size: 1rem; font-weight: 700;
      font-family: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 64 64" fill="none">
    <rect width="64" height="64" rx="14" fill="#007aff" />
    <rect x="14" y="20" width="36" height="5" rx="2.5" fill="white" />
    <rect x="14" y="30" width="26" height="5" rx="2.5" fill="white" opacity=".7" />
    <rect x="14" y="40" width="18" height="5" rx="2.5" fill="white" opacity=".4" />
  </svg>
  <div class="title">mise</div>
  <div class="sub">Нет подключения к интернету. Проверьте соединение и попробуйте снова.</div>
  <button onclick="location.reload()">Повторить</button>
</body>
</html>
